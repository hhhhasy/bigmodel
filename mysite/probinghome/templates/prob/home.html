{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>大模型服务监控平台</title>
    <link rel="icon" type="image/png" href="{% static 'cyraSafe.png' %}">
    <link rel="shortcut icon" href="{% static 'cyraSafe.png' %}">
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3bc47d;
            --accent-color: #f72585;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        body {
            background: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Segoe UI', system-ui, sans-serif;
            transition: var(--transition);
        }

        .service-list {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 1.5rem;
            border: 1px solid rgba(218, 225, 231, 0.5);
            transition: var(--transition);
            height: 100%;
        }

        .list-item {
            padding: 1rem;
            margin: 0.75rem 0;
            border-radius: 12px;
            background: var(--card-bg);
            transition: var(--transition);
            cursor: pointer;
            border: 1px solid rgba(218, 225, 231, 0.5);
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .list-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--primary-color);
            opacity: 0;
            transition: var(--transition);
        }

        .list-item:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow);
            border-color: var(--primary-color);
        }

        .list-item:hover::before {
            opacity: 1;
        }

        /* 选中状态样式 */
        .list-item.selected {
            background: rgba(67, 97, 238, 0.1);
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(67, 97, 238, 0.2);
        }

        .list-item.selected::before {
            opacity: 1;
        }

        .list-item.selected .service-icon {
            background: var(--primary-color);
            color: white;
        }

        .list-item-add {
            background: rgba(67, 97, 238, 0.05);
            border: 1px dashed var(--primary-color);
            color: var(--primary-color);
        }

        .list-item-add:hover {
            background: rgba(67, 97, 238, 0.1);
        }

        .detail-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 2rem;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
            height: 100%;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            position: relative;
        }

        .online { 
            background: var(--secondary-color); 
            box-shadow: 0 0 0 4px rgba(59, 196, 125, 0.2);
            animation: pulse 2s infinite;
        }
        
        .offline { 
            background: var(--accent-color); 
            box-shadow: 0 0 0 4px rgba(247, 37, 133, 0.2);
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(59, 196, 125, 0.4);
            }
            70% {
                box-shadow: 0 0 0 6px rgba(59, 196, 125, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(59, 196, 125, 0);
            }
        }

        .metric-card {
            background: var(--bg-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 0.5rem;
            flex: 1;
            min-width: 200px;
            transition: var(--transition);
            border: 1px solid rgba(218, 225, 231, 0.5);
        }

        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow);
        }

        .chart-container {
            background: var(--bg-color);
            border-radius: 12px;
            margin: 1.5rem 0;
            padding: 1.5rem;
            transition: var(--transition);
            border: 1px solid rgba(218, 225, 231, 0.5);
        }

        .stat-badge {
            background: rgba(67, 97, 238, 0.1);
            color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            transition: var(--transition);
        }

        .form-control {
            border-radius: 8px;
            padding: 0.75rem 1rem;
            border: 1px solid #E0E6ED;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            transition: var(--transition);
        }

        .btn-primary:hover {
            background-color: #3a56d4;
            border-color: #3a56d4;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(67, 97, 238, 0.3);
        }

        .nav-tabs {
            border-bottom: 2px solid #E0E6ED;
        }

        .glow-header {
            position: relative;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
            display: inline-block;
        }
        
        .glow-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border-radius: 2px;
            transition: var(--transition);
        }

        .page-header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(218, 225, 231, 0.5);
        }

        #probeOutput {
            background-color: #1e293b;
            color: #e2e8f0;
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Consolas', monospace;
            transition: var(--transition);
            min-height: 150px;
            max-height: 300px;
            overflow-y: auto;
        }

        #probeOutput .text-success {
            color: #4ade80 !important;
            font-weight: 600;
        }

        #probeOutput .text-danger {
            color: #fb7185 !important;
            font-weight: 600;
        }

        #probeOutput .text-info {
            color: #60a5fa !important;
            font-weight: 600;
        }

        #probeOutput .scan-result {
            color: #000000;
            font-size: 1.05em;
            line-height: 1.6;
        }

        #probeOutput .port-open {
            color: #4ade80;
            font-weight: 600;
        }

        #probeOutput .port-closed {
            color: #fb7185;
        }

        #probeOutput .service-name {
            color: #f59e0b;
            font-weight: 600;
        }

        #probeOutput .ip-address {
            color: #60a5fa;
            font-weight: 600;
        }
        .text-success {
            color: #60a5fa !important;
        }

        .text-danger {
            color: #60a5fa !important;
        }

        .text-info {
            color: #60a5fa !important;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .service-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(67, 97, 238, 0.1);
            border-radius: 10px;
            margin-right: 12px;
            color: var(--primary-color);
            transition: var(--transition);
        }

        .list-item:hover .service-icon {
            background: var(--primary-color);
            color: white;
        }

        .tooltip-inner {
            background-color: var(--text-primary);
            box-shadow: var(--shadow);
        }

        .tooltip.bs-tooltip-auto[x-placement^=top] .arrow::before, 
        .tooltip.bs-tooltip-top .arrow::before {
            border-top-color: var(--text-primary);
        }
    </style>
</head>
<body>
<div class="container-fluid py-4">
    
    <div class="row g-4">
        <!-- 服务列表 -->
        <div class="col-md-4">
            <div class="service-list animate__animated animate__fadeIn">
                <h4 class="mb-4 glow-header"><i class="fas fa-cloud me-2"></i>服务节点</h4>
                <div class="service-nodes">
                    {% for service in services %}
                        <div class="list-item animate__animated animate__fadeIn" 
                             id="service-{{ service.name|slugify }}" 
                             data-service-name="{{ service.name }}"
                             style="animation-delay: {{ forloop.counter | divisibleby:10 }}00ms" 
                             onclick="loadServiceDetail('{{ service.name }}', this)">
                            <div class="status-indicator online"></div>
                            <div class="service-icon">
                                <i class="fas fa-microchip"></i>
                            </div>
                            <div>
                                <h6 class="mb-1 fw-semibold">{{ service.name }}</h6>
                                <small class="text-muted"></small>
                            </div>
                            <div class="ms-auto stat-badge">在线</div>
                        </div>
                    {% endfor %}
                </div>
                <div class="list-item list-item-add animate__animated animate__fadeIn" style="animation-delay: 500ms" onclick="showAddForm()">
                    <div class="service-icon">
                        <i class="fas fa-plus"></i>
                    </div>
                    <span>添加新服务</span>
                </div>
                <div id="addFormContainer" class="mt-3 animate__animated animate__fadeIn" style="display: none;"></div>
            </div>
        </div>

        <!-- 详情展示 -->
        <div class="col-md-8">
            <div class="detail-card animate__animated animate__fadeIn">
                <h4 class="mb-4 glow-header"><i class="fas fa-chart-line me-2"></i>服务监控</h4>
                <div id="detail-content" class="fade-in">
                    <div class="text-center py-5">
                        <div class="mb-4">
                            <div class="service-icon mx-auto" style="width: 80px; height: 80px; font-size: 2rem;">
                                <i class="fas fa-chart-pie"></i>
                            </div>
                        </div>
                        <h5 class="text-secondary">选择服务节点查看监控数据</h5>
                        <p class="text-muted">从左侧列表中选择一个服务节点以查看详细信息和执行探测操作</p>
                    </div>
                </div>
                
                <!-- 数据可视化容器 -->
                <div class="chart-container d-none animate__animated animate__fadeIn" id="metricsChart">
                    <h5 class="mb-3"><i class="fas fa-terminal me-2"></i>探测结果</h5>
                    <pre id="probeOutput" class="p-3 rounded mt-2"></pre>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// 初始化工具提示
document.addEventListener('DOMContentLoaded', function() {
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
    var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl)
    })
    
    // 添加点击事件监听器用于测试选中状态
    document.querySelectorAll('.list-item').forEach(item => {
        item.addEventListener('click', function() {
            // 移除所有选中状态
            document.querySelectorAll('.list-item').forEach(listItem => {
                listItem.classList.remove('selected');
            });
            // 为当前点击的项目添加选中状态
            this.classList.add('selected');
        });
    });
});

function loadServiceDetail(serviceName, element) {
    // 移除所有选中状态
    document.querySelectorAll('.list-item').forEach(item => {
        item.classList.remove('selected');
    });
    
    // 为当前点击的项目添加选中状态
    element.classList.add('selected');
    
    // 加载动画
    document.getElementById('detail-content').innerHTML = `
        <div class="text-center py-4 animate__animated animate__pulse">
            <div class="spinner-grow text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
            <p class="mt-3 text-muted">正在加载服务数据...</p>
        </div>
    `;

    fetch(`/Probing/service/${serviceName}/`)
        .then(response => response.json())
        .then(data => {
            const detailHtml = `
                <div class="row animate__animated animate__fadeIn">
                    <div class="col-md-6">
                        <div class="card border-0 shadow-sm p-3 mb-3">
                            <h5 class="mb-3"><i class="fas fa-info-circle me-2 text-primary"></i>基础信息</h5>
                            <div class="d-flex align-items-center mb-3">
                                <div class="service-icon">
                                    <i class="fas fa-server"></i>
                                </div>
                                <h4 class="mb-0">${data.name}</h4>
                            </div>
                            <div class="row g-3 mt-2">
                                <div class="col-6">
                                    <div class="p-3 bg-light rounded-3">
                                        <small class="text-muted d-block">端口号</small>
                                        <span class="fw-bold">${data.port || '未记录'}</span>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="p-3 bg-light rounded-3">
                                        <small class="text-muted d-block">认证机制</small>
                                        <span class="fw-bold">${data.auth}</span>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="p-3 bg-light rounded-3">
                                        <small class="text-muted d-block">Banner信息</small>
                                        <span class="fw-bold">${data.banner}</span>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="p-3 bg-light rounded-3">
                                        <small class="text-muted d-block">API端点</small>
                                        <code class="bg-dark text-light p-2 rounded d-block mt-1">${data.api || '未配置'}</code>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card border-0 shadow-sm p-3">
                            <h5 class="mb-3"><i class="fas fa-chart-bar me-2 text-primary"></i>实时状态</h5>
                            <div class="mt-3">
                                <div class="mb-3">
                                    <label for="ipAddress" class="form-label small text-muted">目标IP地址</label>
                                    <div class="input-group mb-3">
                                        <span class="input-group-text"><i class="fas fa-globe"></i></span>
                                        <input type="text" class="form-control" id="ipAddress" placeholder="输入要探测的IP地址">
                                    </div>
                                </div>
                                <button type="button" 
                                        class="btn btn-primary w-100" 
                                        onclick="handleProbe('${serviceName}', '${data.auth}', ${data.port})">
                                    <i class="fas fa-satellite-dish me-1"></i>一键探测
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('detail-content').innerHTML = detailHtml;
            document.getElementById('metricsChart').classList.remove('d-none');
        });
}

// 美化后的新增表单
function showAddForm() {
    const formHtml = `
        <div class="border rounded p-3 bg-light animate__animated animate__fadeIn">
            <h6 class="mb-3 text-primary"><i class="fas fa-plus-circle me-2"></i>新建服务配置</h6>
            <form id="serviceForm" onsubmit="return submitService(event)">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small text-muted">服务名称</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-tag"></i></span>
                            <input type="text" class="form-control" name="name" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-muted">API地址</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-link"></i></span>
                            <input type="text" class="form-control" name="api" required>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small text-muted">端口号</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-network-wired"></i></span>
                            <input type="text" class="form-control" name="port" required>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small text-muted">banner信息</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-flag"></i></span>
                            <input type="text" class="form-control" name="banner" required>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small text-muted">认证类型</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <select class="form-select" name="auth">
                                <option>无认证</option>
                                <option>有认证</option>
                                <option>可选认证</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <button type="button" class="btn btn-light" onclick="hideAddForm()">
                        <i class="fas fa-times me-1"></i>取消
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-check me-1"></i>创建服务
                    </button>
                </div>
            </form>
        </div>`;
    document.getElementById('addFormContainer').innerHTML = formHtml;
    document.getElementById('addFormContainer').style.display = 'block';
    document.getElementById('addFormContainer').classList.add('animate__fadeIn');
}

function hideAddForm() {
    const container = document.getElementById('addFormContainer');
    container.classList.remove('animate__fadeIn');
    container.classList.add('animate__fadeOut');
    setTimeout(() => {
        container.style.display = 'none';
        container.classList.remove('animate__fadeOut');
    }, 500);
}

async function submitService(event) {
    event.preventDefault();
    const formData = {
        name: event.target.name.value,
        api: event.target.api.value,
        port: event.target.port.value,
        auth: event.target.auth.value,
        banner: event.target.banner.value
    };

    const submitBtn = event.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 提交中...';

    try {
        const response = await fetch('/Probing/api/services/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(formData)
        });

        if (!response.ok) throw new Error(await response.text());
        
        // 成功提示
        const successAlert = document.createElement('div');
        successAlert.className = 'alert alert-success animate__animated animate__fadeIn';
        successAlert.innerHTML = '<i class="fas fa-check-circle me-2"></i>服务添加成功！';
        event.target.parentNode.appendChild(successAlert);
        
        setTimeout(() => {
            hideAddForm();
            window.location.reload();
        }, 1500);
    } catch (error) {
        // 错误提示
        const errorAlert = document.createElement('div');
        errorAlert.className = 'alert alert-danger animate__animated animate__fadeIn';
        errorAlert.innerHTML = `<i class="fas fa-exclamation-circle me-2"></i>${error.message || '发生错误，请重试'}`;
        event.target.parentNode.appendChild(errorAlert);
        
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-check me-1"></i>创建服务';
        
        setTimeout(() => {
            errorAlert.classList.remove('animate__fadeIn');
            errorAlert.classList.add('animate__fadeOut');
            setTimeout(() => errorAlert.remove(), 500);
        }, 3000);
    }
}

// Django CSRF Token 获取
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// 处理探测逻辑
function handleProbe(serviceName, authType, port) {
    const output = document.getElementById('probeOutput');
    const probeSection = document.getElementById('metricsChart');
    const ipAddress = document.getElementById('ipAddress').value.trim();
    
    if (!ipAddress) {
        // 显示错误提示
        const ipInput = document.getElementById('ipAddress');
        ipInput.classList.add('is-invalid');
        const feedback = document.createElement('div');
        feedback.className = 'invalid-feedback';
        feedback.innerText = '请输入要探测的IP地址';
        ipInput.parentNode.appendChild(feedback);
        
        setTimeout(() => {
            ipInput.classList.remove('is-invalid');
            feedback.remove();
        }, 3000);
        return;
    }
    
    probeSection.style.display = 'block';
    output.innerHTML = '<div class="text-info"><i class="fas fa-spinner fa-spin me-2"></i>正在执行nmap扫描，请稍候...</div>';
    console.log(`Probing service: ${serviceName}, Auth: ${authType.toLowerCase()}, Port: ${port}, IP: ${ipAddress}`);

    // 添加进度动画
    const progressBar = document.createElement('div');
    progressBar.className = 'progress mt-2';
    progressBar.innerHTML = `<div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>`;
    output.appendChild(progressBar);
    
    let progress = 0;
    const progressInterval = setInterval(() => {
        progress += 5;
        if (progress > 90) clearInterval(progressInterval);
        progressBar.querySelector('.progress-bar').style.width = `${progress}%`;
    }, 300);

    // 发送请求到后端执行nmap扫描
    fetch('/Probing/api/scan/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({
            ip: ipAddress,
            port: port,
            service_name: serviceName
        })
    })
    .then(response => response.json())
    .then(data => {
        clearInterval(progressInterval);
        progressBar.remove();
        
        if (data.status === 'success') {
            output.innerHTML = `<div class="text-success animate__animated animate__fadeIn"><i class="fas fa-check-circle me-2"></i>扫描完成</div><div class="mt-3 p-3 bg-primary rounded">${data.result.replace(/\n/g, '<br>')}</div>`;
        } else {
            output.innerHTML = `<div class="text-danger animate__animated animate__fadeIn"><i class="fas fa-exclamation-circle me-2"></i>扫描失败: ${data.message}</div>`;
        }
    })
    .catch(error => {
        clearInterval(progressInterval);
        progressBar.remove();
        output.innerHTML = `<div class="text-danger animate__animated animate__fadeIn"><i class="fas fa-exclamation-triangle me-2"></i>请求错误: ${error.message}</div>`;
    });
}

</script>
</body>
</html>
